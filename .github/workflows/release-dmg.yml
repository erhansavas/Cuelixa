# SPDX-License-Identifier: Apache-2.0
name: Build free macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dmg:
    name: release-macos-arm64-dmg
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve project release identity
        shell: bash
        run: |
          set -euo pipefail
          settings=$(xcodebuild -project CuelixaMac.xcodeproj -scheme Cuelixa -configuration Release -showBuildSettings)
          version=$(printf '%s\n' "$settings" | awk '/ MARKETING_VERSION = / {print $3; exit}')
          build=$(printf '%s\n' "$settings" | awk '/ CURRENT_PROJECT_VERSION = / {print $3; exit}')
          test -n "$version"
          test -n "$build"
          printf 'VERSION=%s\nBUILD=%s\nDMG=Cuelixa-%s-macOS-arm64.dmg\n' "$version" "$build" "$version" >> "$GITHUB_ENV"

      - name: Verify source integrity and release identity
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/verify-source-manifest.sh
          test "$(uname -m)" = arm64
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcodebuild -version | grep -Fx 'Build version 17F113'
          grep -Fq 'MACOSX_DEPLOYMENT_TARGET = 26.0;' CuelixaMac.xcodeproj/project.pbxproj
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi

      - name: Run CI qualification gate
        shell: bash
        env:
          CUELIXA_CI_MODE: '1'
        run: ./VALIDATE-MAC.sh

      - name: Build, ad-hoc sign, and verify app
        shell: bash
        run: |
          set -euo pipefail
          work_root=$(mktemp -d "${RUNNER_TEMP}/cuelixa-release.XXXXXX")
          echo "CUELIXA_RELEASE_ROOT=$work_root" >> "$GITHUB_ENV"
          derived_data="$work_root/DerivedData"
          xcodebuild \
            -project CuelixaMac.xcodeproj \
            -scheme Cuelixa \
            -configuration Release \
            -derivedDataPath "$derived_data" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="$derived_data/Build/Products/Release/Cuelixa.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.erhansavas.Cuelixa
          test "$(lipo -archs "$app/Contents/MacOS/Cuelixa")" = arm64
          codesign --force --sign - --timestamp=none --options runtime "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign -d --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature" | grep -F 'Signature=adhoc'
          printf '%s\n' "$signature" | grep -Eq 'flags=0x[0-9a-fA-F]+\([^)]*runtime[^)]*\)'
          entitlements="$work_root/entitlements.plist"
          codesign -d --entitlements :- "$app" > "$entitlements" 2>/dev/null || true
          ! grep -q 'get-task-allow' "$entitlements"

      - name: Create and verify read-only DMG
        shell: bash
        run: |
          set -euo pipefail
          app="$CUELIXA_RELEASE_ROOT/DerivedData/Build/Products/Release/Cuelixa.app"
          stage="$CUELIXA_RELEASE_ROOT/stage"
          mount_point="$CUELIXA_RELEASE_ROOT/mount"
          mkdir -p "$stage" "$mount_point" dist
          ditto "$app" "$stage/Cuelixa.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname Cuelixa -srcfolder "$stage" -format UDZO -ov "dist/$DMG"
          hdiutil verify "dist/$DMG"
          attach_output=$(hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "dist/$DMG")
          device=$(printf '%s\n' "$attach_output" | awk '/Apple_HFS|Apple_APFS/ {print $1; exit}')
          test -n "$device"
          trap 'hdiutil detach "$device" >/dev/null 2>&1 || true' EXIT
          mounted_app="$mount_point/Cuelixa.app"
          test -d "$mounted_app"
          test -L "$mount_point/Applications"
          test "$(lipo -archs "$mounted_app/Contents/MacOS/Cuelixa")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mounted_app/Contents/Info.plist")" = io.github.erhansavas.Cuelixa
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          hdiutil detach "$device"
          trap - EXIT

      - name: Freeze and verify DMG SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "$DMG" > "$DMG.sha256"
          shasum -a 256 -c "$DMG.sha256"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.DMG }}
            dist/${{ env.DMG }}.sha256
          create-storage-record: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cuelixa-${{ env.VERSION }}-macOS-arm64
          path: |
            dist/${{ env.DMG }}
            dist/${{ env.DMG }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish matching GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/$DMG" "dist/$DMG.sha256" \
            --title "Cuelixa $VERSION" \
            --notes-file CHANGELOG.md \
            --verify-tag
