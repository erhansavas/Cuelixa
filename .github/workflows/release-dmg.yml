# SPDX-License-Identifier: Apache-2.0
name: Verify released macOS DMG

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify-release-macos-arm64-dmg
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and verify release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/.*MARKETING_VERSION = ([^;]+);.*/\1/p' CuelixaMac.xcodeproj/project.pbxproj | head -n 1)
          build=$(sed -nE 's/.*CURRENT_PROJECT_VERSION = ([^;]+);.*/\1/p' CuelixaMac.xcodeproj/project.pbxproj | head -n 1)
          test -n "$version"
          test -n "$build"
          tag="${{ github.event.release.tag_name }}"
          dmg="Cuelixa-${version}-macOS-arm64.dmg"
          test "$tag" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${tag}^{commit}")"
          ./Scripts/verify-source-manifest.sh
          grep -Fq 'MACOSX_DEPLOYMENT_TARGET = 27.0;' CuelixaMac.xcodeproj/project.pbxproj

          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_json"
          python3 - "$release_json" "$tag" "$version" "$dmg" <<'PY'
          import json
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text())
          tag, version, dmg = sys.argv[2:5]
          if release.get("tag_name") != tag:
              raise SystemExit("release tag does not match the checked-out tag")
          if release.get("name") != f"Cuelixa {version}":
              raise SystemExit("release name does not match the project version")
          if release.get("draft") is not False:
              raise SystemExit("release must be published before verification")
          if not isinstance(release.get("prerelease"), bool):
              raise SystemExit("release prerelease state is invalid")
          if release.get("immutable") is not True:
              raise SystemExit("release is not immutable")
          actual = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted([dmg, f"{dmg}.sha256"])
          if actual != expected:
              raise SystemExit(f"unexpected release assets: {actual!r}")
          channel = "pre-release" if release["prerelease"] else "stable release"
          print(f"verified published {channel}: {tag}")
          PY

          printf 'VERSION=%s\nBUILD=%s\nTAG=%s\nDMG=%s\n' \
            "$version" "$build" "$tag" "$dmg" >> "$GITHUB_ENV"

      - name: Verify published release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-release-notes.md"
          actual="$RUNNER_TEMP/actual-release-notes.md"
          ./Scripts/extract-release-notes.sh "$VERSION" "$BUILD" "$expected"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$actual"
          python3 - "$expected" "$actual" <<'PY'
          from pathlib import Path
          import sys
          expected = Path(sys.argv[1]).read_text().rstrip("\n")
          actual = Path(sys.argv[2]).read_text().rstrip("\n")
          if expected != actual:
              raise SystemExit("published release notes do not match the exact changelog section")
          PY

      - name: Download immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern "$DMG" \
            --pattern "$DMG.sha256"
          test -f "dist/$DMG"
          test -f "dist/$DMG.sha256"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2

      - name: Verify frozen checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(awk 'NF {print $2}' "$DMG.sha256")" = "$DMG"
          shasum -a 256 -c "$DMG.sha256"

      - name: Remount and verify packaged application
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify "dist/$DMG"
          work_root=$(mktemp -d "${RUNNER_TEMP}/cuelixa-release-verify.XXXXXX")
          mount_point="$work_root/mount"
          mkdir -p "$mount_point"
          diskutil image attach --readOnly --nobrowse --mountPoint "$mount_point" "dist/$DMG"
          trap 'diskutil eject "$mount_point" >/dev/null 2>&1 || true; rm -rf "$work_root"' EXIT
          app="$mount_point/Cuelixa.app"
          test -d "$app"
          test -L "$mount_point/Applications"
          test "$(lipo -archs "$app/Contents/MacOS/Cuelixa")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.erhansavas.Cuelixa
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 27.0
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign -d --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature" | grep -F 'Signature=adhoc'
          printf '%s\n' "$signature" | grep -Eq 'flags=0x[0-9a-fA-F]+\([^)]*runtime[^)]*\)'
          entitlements="$work_root/entitlements.plist"
          codesign -d --entitlements :- "$app" > "$entitlements" 2>/dev/null || true
          ! grep -q 'get-task-allow' "$entitlements"
          diskutil eject "$mount_point"
          trap - EXIT
          rm -rf "$work_root"
