# Temporary finalization workflow. This file removes itself before publishing the candidate commit.
name: Finalize Cuelixa 0.7.1 candidate

on:
  push:
    branches: [release/0.7.1-final]

permissions:
  contents: write

concurrency:
  group: cuelixa-071-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27_beta_6.app/Contents/Developer
      CUELIXA_BUILD_ONLY: '1'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final source, repository, and release cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/0.7.1-final'

          git mv CuelixaMac/PlayerPanel.swift CuelixaMac/SeekSlider.swift
          sed -i '' 's/PlayerPanel\.swift/SeekSlider.swift/g' CuelixaMac.xcodeproj/project.pbxproj VALIDATE-MAC.sh

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          utilities_path = Path('CuelixaMac/Utilities.swift')
          utilities = utilities_path.read_text()
          utilities = utilities.replace('import CryptoKit\n', '').replace('import Darwin\n', '')

          natural_start = utilities.find('func naturalKey(')
          natural_end = utilities.find('func naturalLess(')
          if natural_start < 0 or natural_end < 0 or natural_end <= natural_start:
              raise SystemExit('naturalKey/naturalLess boundary not found')
          utilities = utilities[:natural_start] + utilities[natural_end:]

          file_start = utilities.find('func sha256File(')
          file_end = utilities.find('private enum DisplayTitleCleaner')
          if file_start < 0 or file_end < 0 or file_end <= file_start:
              raise SystemExit('filesystem helper boundary not found')
          filesystem_helpers = utilities[file_start:file_end].rstrip() + '\n\n'
          utilities = utilities[:file_start] + utilities[file_end:]
          utilities_path.write_text(utilities)

          local_path = Path('CuelixaMac/LocalFileAccess.swift')
          local = local_path.read_text()
          if 'import CryptoKit\n' not in local:
              local = local.replace('import Darwin\n', 'import CryptoKit\nimport Darwin\n', 1)
          marker = '/// A shared lease prevents stale-import cleanup and concurrent import batches from\n'
          if marker not in local:
              raise SystemExit('LocalFileAccess insertion marker not found')
          if 'func sha256File(' in local:
              raise SystemExit('filesystem helpers already present in LocalFileAccess')
          local = local.replace(marker, filesystem_helpers + marker, 1)
          local_path.write_text(local)

          playback = Path('CuelixaMac/PlaybackController.swift')
          text = playback.read_text()
          old = '''  /// AppModel owns one PlaybackController for the application lifetime. Normal
            /// stop/start cycles keep media commands registered once; confirmed process
            /// termination removes every target deterministically.
          '''
          new = '''  /// Remote-command targets are installed only after verified playback progression
            /// and removed during ordinary player teardown. Confirmed process shutdown
            /// calls the same teardown path and remains idempotent.
          '''
          if old not in text:
              raise SystemExit('PlaybackController stale-comment anchor not found')
          playback.write_text(text.replace(old, new, 1))

          subtitle = Path('CuelixaMac/Subtitle.swift')
          text = subtitle.read_text()
          old = '''  /// AVPlayer does not parse external SRT payloads for the custom subtitle
            /// overlay. Normalize the presentation subset that mpv decoded for the
            /// accepted Cuelixa subtitle presentation while preserving authored line breaks.
          '''
          new = '''  /// AVPlayer does not parse external SRT payloads for the custom subtitle
            /// overlay. Normalize a conservative subset of common SRT formatting while
            /// preserving authored line breaks for Cuelixa's own subtitle presentation.
          '''
          if old not in text:
              raise SystemExit('Subtitle stale-comment anchor not found')
          subtitle.write_text(text.replace(old, new, 1))

          project = Path('CuelixaMac.xcodeproj/project.pbxproj')
          text = project.read_text()
          if 'CURRENT_PROJECT_VERSION = 53;' not in text or 'MARKETING_VERSION = 0.7;' not in text:
              raise SystemExit('expected 0.7/53 project metadata not found')
          text = text.replace('CURRENT_PROJECT_VERSION = 53;', 'CURRENT_PROJECT_VERSION = 54;')
          text = text.replace('MARKETING_VERSION = 0.7;', 'MARKETING_VERSION = 0.7.1;')
          project.write_text(text)

          release = Path('.github/workflows/release-dmg.yml')
          text = release.read_text()
          publish_marker = '      - name: Publish matching GitHub Release\n'
          if publish_marker not in text:
              raise SystemExit('release publish step not found')
          extract_step = '''      - name: Extract current release notes
            if: github.ref_type == 'tag'
            shell: bash
            run: |
              set -euo pipefail
              notes="$RUNNER_TEMP/release-notes.md"
              ./Scripts/extract-release-notes.sh "$VERSION" "$BUILD" "$notes"
              echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

          '''
          text = text.replace(publish_marker, extract_step + publish_marker, 1)
          old_publish = '''            --title "Cuelixa $VERSION" \\
            --notes-file CHANGELOG.md \\
            --verify-tag
          '''
          new_publish = '''            --title "Cuelixa $VERSION" \\
            --notes-file "$RELEASE_NOTES" \\
            --prerelease \\
            --verify-tag
          '''
          if old_publish not in text:
              raise SystemExit('release notes publish arguments not found')
          release.write_text(text.replace(old_publish, new_publish, 1))

          validator = Path('VALIDATE-MAC.sh')
          text = validator.read_text()
          insertion = "print '=== Environment ==='\n"
          release_check = '''release_notes_check=$(mktemp "${TMPDIR:-/tmp}/cuelixa-release-notes.XXXXXX")
          ./Scripts/extract-release-notes.sh "$expected_version" "$expected_build" "$release_notes_check"
          [[ "$(head -n 1 "$release_notes_check")" == "## Cuelixa $expected_version (build $expected_build)" ]] || fail 'release notes heading mismatch'
          [[ "$(grep -c '^## Cuelixa ' "$release_notes_check")" == 1 ]] || fail 'release notes crossed a release boundary'
          rm -f "$release_notes_check"
          pass 'RELEASE_NOTES_EXTRACTION'

          '''
          if insertion not in text:
              raise SystemExit('validator environment marker not found')
          text = text.replace(insertion, release_check + insertion, 1)
          validator.write_text(text)

          Path('docs/audits').mkdir(parents=True, exist_ok=True)
          if not Path('AUDIT-REPORT.md').exists():
              raise SystemExit('historical audit root file missing')

          # Update markdown links that still point at the historical root file.
          target = Path('docs/audits/2026-09-engineering-audit.md')
          for md in Path('.').rglob('*.md'):
              if md == Path('AUDIT-REPORT.md'):
                  continue
              source = md.read_text()
              rel = os.path.relpath(target, md.parent).replace(os.sep, '/')
              updated = re.sub(r'(?<=\()(?:(?:\.\./)*)AUDIT-REPORT\.md(?=\))', rel, source)
              if updated != source:
                  md.write_text(updated)
          PY

          git mv AUDIT-REPORT.md docs/audits/2026-09-engineering-audit.md
          cat > docs/audits/README.md <<'EOF'
          # Historical engineering audits

          Files in this directory preserve point-in-time engineering evidence. They are not the current architecture, qualification status, or release source of truth.

          - `2026-09-engineering-audit.md` records the earlier 0.6.66/0.7 engineering audit and the environments/results that were true at that time.

          Current implementation ownership is documented in [`../ARCHITECTURE.md`](../ARCHITECTURE.md); current qualification and release gates are in [`../QUALIFICATION.md`](../QUALIFICATION.md) and [`../RELEASE.md`](../RELEASE.md).
          EOF

          chmod +x Scripts/extract-release-notes.sh

          test ! -e CuelixaMac/PlayerPanel.swift
          test -f CuelixaMac/SeekSlider.swift
          ! grep -R -nF 'PlayerPanel.swift' -- . ':!SOURCE-SHA256SUMS.txt'
          ! grep -R -nF 'docs/PUBLICATION.md' -- '*.md' 2>/dev/null || exit 1
          ! grep -R -nE 'MARKETING_VERSION = 0\.7;|CURRENT_PROJECT_VERSION = 53;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq 'MARKETING_VERSION = 0.7.1;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq 'CURRENT_PROJECT_VERSION = 54;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq -- '--prerelease' .github/workflows/release-dmg.yml
          grep -Fq -- '--notes-file "$RELEASE_NOTES"' .github/workflows/release-dmg.yml
          test "$(grep -RIl 'func naturalKey(' CuelixaMac | wc -l | tr -d ' ')" = 0
          grep -Fq 'func sha256File(' CuelixaMac/LocalFileAccess.swift
          ! grep -Fq 'func sha256File(' CuelixaMac/Utilities.swift

      - name: Remove temporary workflow and regenerate source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm --quiet .github/workflows/cuelixa-071-finalize.yml
          manifest=SOURCE-SHA256SUMS.txt
          temp=$(mktemp)
          while IFS= read -r path; do
            test "$path" = "$manifest" && continue
            shasum -a 256 "$path"
          done < <(git ls-files | LC_ALL=C sort) > "$temp"
          mv "$temp" "$manifest"
          ./Scripts/verify-source-manifest.sh
          notes=$(mktemp)
          ./Scripts/extract-release-notes.sh 0.7.1 54 "$notes"
          test "$(grep -c '^## Cuelixa ' "$notes")" = 1
          rm -f "$notes"

      - name: Validate final candidate on hosted Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          ./VALIDATE-MAC.sh

      - name: Publish clean finalization commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test ! -e .github/workflows/cuelixa-071-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Cuelixa 0.7.1 candidate'
          git push origin HEAD:release/0.7.1-final
