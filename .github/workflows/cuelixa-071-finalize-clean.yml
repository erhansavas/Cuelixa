# Temporary: removes itself before publishing the validated candidate commit.
name: Clean-finalize Cuelixa 0.7.1

on:
  push:
    branches: [release/0.7.1-final]

permissions:
  contents: write

concurrency:
  group: cuelixa-071-clean-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27_beta_6.app/Contents/Developer
      CUELIXA_BUILD_ONLY: '1'
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final repository transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/0.7.1-final'

          git mv CuelixaMac/PlayerPanel.swift CuelixaMac/SeekSlider.swift
          sed -i '' 's/PlayerPanel\.swift/SeekSlider.swift/g' CuelixaMac.xcodeproj/project.pbxproj VALIDATE-MAC.sh

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          # Keep generic display/media utilities small; move filesystem identity helpers
          # to the existing local-file subsystem without changing their API names.
          utilities_path = Path('CuelixaMac/Utilities.swift')
          utilities = utilities_path.read_text()
          unused = '''func naturalKey(_ value: String) -> [String] {
            value.lowercased().split(whereSeparator: { !$0.isLetter && !$0.isNumber }).map(String.init)
          }

          '''
          if unused not in utilities:
              raise SystemExit('unused naturalKey block not found')
          utilities = utilities.replace(unused, '', 1)
          begin = utilities.index('func sha256File(')
          end = utilities.index('private enum DisplayTitleCleaner')
          helpers = utilities[begin:end].rstrip() + '\n\n'
          utilities = utilities[:begin] + utilities[end:]
          utilities = utilities.replace('import CryptoKit\n', '').replace('import Darwin\n', '')
          utilities_path.write_text(utilities)

          local_path = Path('CuelixaMac/LocalFileAccess.swift')
          local = local_path.read_text()
          boundary = '\n/// A shared lease covers active imports; startup cleanup takes a nonblocking\n'
          if boundary not in local:
              raise SystemExit('LocalFileAccess lease boundary not found')
          if 'func sha256File(' in local:
              raise SystemExit('filesystem helper already moved')
          local = local.replace('import Darwin\n', 'import CryptoKit\nimport Darwin\n', 1)
          local = local.replace(boundary, '\n' + helpers + boundary.lstrip('\n'), 1)
          local_path.write_text(local)

          playback_path = Path('CuelixaMac/PlaybackController.swift')
          playback = playback_path.read_text()
          old = '''  /// AppModel owns one PlaybackController for the application lifetime. Normal
          /// stop/start cycles keep media commands registered once; confirmed process
          /// termination removes every target deterministically.
          '''
          new = '''  /// Remote-command targets are installed only after verified playback progression
          /// and removed during ordinary player teardown. Confirmed process shutdown
          /// calls the same teardown path and remains idempotent.
          '''
          if old not in playback:
              raise SystemExit('PlaybackController stale comment not found')
          playback_path.write_text(playback.replace(old, new, 1))

          subtitle_path = Path('CuelixaMac/Subtitle.swift')
          subtitle = subtitle_path.read_text()
          old = '''  /// AVPlayer does not parse external SRT payloads for the custom subtitle
          /// overlay. Normalize the presentation subset that mpv decoded for the
          /// accepted Cuelixa subtitle presentation while preserving authored line breaks.
          '''
          new = '''  /// AVPlayer does not parse external SRT payloads for the custom subtitle
          /// overlay. Normalize a conservative subset of common SRT formatting while
          /// preserving authored line breaks for Cuelixa's own subtitle presentation.
          '''
          if old not in subtitle:
              raise SystemExit('Subtitle stale comment not found')
          subtitle_path.write_text(subtitle.replace(old, new, 1))

          project_path = Path('CuelixaMac.xcodeproj/project.pbxproj')
          project = project_path.read_text()
          if project.count('CURRENT_PROJECT_VERSION = 53;') == 0 or project.count('MARKETING_VERSION = 0.7;') == 0:
              raise SystemExit('0.7/53 project identity not found')
          project = project.replace('CURRENT_PROJECT_VERSION = 53;', 'CURRENT_PROJECT_VERSION = 54;')
          project = project.replace('MARKETING_VERSION = 0.7;', 'MARKETING_VERSION = 0.7.1;')
          project_path.write_text(project)

          release_path = Path('.github/workflows/release-dmg.yml')
          release = release_path.read_text()
          publish_marker = '      - name: Publish matching GitHub Release\n'
          if publish_marker not in release or release.count(publish_marker) != 1:
              raise SystemExit('unique release publish marker not found')
          extract = '''      - name: Extract current release notes
            if: github.ref_type == 'tag'
            shell: bash
            run: |
              set -euo pipefail
              notes="$RUNNER_TEMP/release-notes.md"
              ./Scripts/extract-release-notes.sh "$VERSION" "$BUILD" "$notes"
              echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

          '''
          release = release.replace(publish_marker, extract + publish_marker, 1)
          old_notes = '            --notes-file CHANGELOG.md \\\n            --verify-tag'
          new_notes = '            --notes-file "$RELEASE_NOTES" \\\n            --prerelease \\\n            --verify-tag'
          if old_notes not in release:
              raise SystemExit('old release-notes arguments not found')
          release_path.write_text(release.replace(old_notes, new_notes, 1))

          validator_path = Path('VALIDATE-MAC.sh')
          validator = validator_path.read_text()
          marker = "print '=== Environment ==='\n"
          if marker not in validator or validator.count(marker) != 1:
              raise SystemExit('validator environment marker not unique')
          check = '''release_notes_check=$(mktemp "${TMPDIR:-/tmp}/cuelixa-release-notes.XXXXXX")
          ./Scripts/extract-release-notes.sh "$expected_version" "$expected_build" "$release_notes_check"
          [[ "$(head -n 1 "$release_notes_check")" == "## Cuelixa $expected_version (build $expected_build)" ]] || fail 'release notes heading mismatch'
          [[ "$(grep -c '^## Cuelixa ' "$release_notes_check")" == 1 ]] || fail 'release notes crossed a release boundary'
          rm -f "$release_notes_check"
          pass 'RELEASE_NOTES_EXTRACTION'

          '''
          validator_path.write_text(validator.replace(marker, check + marker, 1))

          # Preserve the audit as historical evidence, not as root-level current truth.
          audit = Path('AUDIT-REPORT.md')
          if not audit.exists():
              raise SystemExit('AUDIT-REPORT.md missing')
          target = Path('docs/audits/2026-09-engineering-audit.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          for md in Path('.').rglob('*.md'):
              if md == audit:
                  continue
              source = md.read_text()
              rel = os.path.relpath(target, md.parent).replace(os.sep, '/')
              updated = re.sub(r'(?<=\()(?:(?:\.\./)*)AUDIT-REPORT\.md(?=\))', rel, source)
              if updated != source:
                  md.write_text(updated)
          PY

          git mv AUDIT-REPORT.md docs/audits/2026-09-engineering-audit.md
          cat > docs/audits/README.md <<'EOF'
          # Historical engineering audits

          Files in this directory preserve point-in-time engineering evidence. They are not the current architecture, qualification status, or release source of truth.

          - `2026-09-engineering-audit.md` records the earlier 0.6.66/0.7 engineering audit and the environments/results that were true at that time.

          Current implementation ownership is documented in [`../ARCHITECTURE.md`](../ARCHITECTURE.md); current qualification and release gates are in [`../QUALIFICATION.md`](../QUALIFICATION.md) and [`../RELEASE.md`](../RELEASE.md).
          EOF

          chmod +x Scripts/extract-release-notes.sh
          xcrun swift-format format -i \
            CuelixaMac/LocalFileAccess.swift CuelixaMac/Utilities.swift \
            CuelixaMac/PlaybackController.swift CuelixaMac/Subtitle.swift CuelixaMac/SeekSlider.swift

          test ! -e CuelixaMac/PlayerPanel.swift
          test -f CuelixaMac/SeekSlider.swift
          if grep -R -nF 'PlayerPanel.swift' CuelixaMac CuelixaMac.xcodeproj VALIDATE-MAC.sh docs README.md CHANGELOG.md; then exit 1; fi
          if grep -R -nF 'PUBLICATION.md' --include='*.md' README.md docs SECURITY.md CONTRIBUTING.md; then exit 1; fi
          if grep -R -nE 'MARKETING_VERSION = 0\.7;|CURRENT_PROJECT_VERSION = 53;' CuelixaMac.xcodeproj/project.pbxproj; then exit 1; fi
          grep -Fq 'MARKETING_VERSION = 0.7.1;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq 'CURRENT_PROJECT_VERSION = 54;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq -- '--prerelease' .github/workflows/release-dmg.yml
          grep -Fq -- '--notes-file "$RELEASE_NOTES"' .github/workflows/release-dmg.yml
          if grep -R -nF 'func naturalKey(' CuelixaMac; then exit 1; fi
          grep -Fq 'func sha256File(' CuelixaMac/LocalFileAccess.swift
          if grep -Fq 'func sha256File(' CuelixaMac/Utilities.swift; then exit 1; fi

      - name: Freeze tracked source tree
        shell: bash
        run: |
          set -euo pipefail
          git rm --quiet .github/workflows/cuelixa-071-finalize-clean.yml
          git add -A

          manifest=SOURCE-SHA256SUMS.txt
          temp=$(mktemp)
          while IFS= read -r path; do
            test "$path" = "$manifest" && continue
            shasum -a 256 "$path"
          done < <(git ls-files | LC_ALL=C sort) > "$temp"
          mv "$temp" "$manifest"
          git add "$manifest"

          ./Scripts/verify-source-manifest.sh
          notes=$(mktemp)
          ./Scripts/extract-release-notes.sh 0.7.1 54 "$notes"
          test "$(head -n 1 "$notes")" = '## Cuelixa 0.7.1 (build 54)'
          test "$(grep -c '^## Cuelixa ' "$notes")" = 1
          rm -f "$notes"
          test ! -e .github/workflows/cuelixa-071-finalize-clean.yml

      - name: Hosted Xcode 27 build-only validation
        shell: bash
        run: ./VALIDATE-MAC.sh

      - name: Publish validated clean candidate commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/cuelixa-071-finalize-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Finalize Cuelixa 0.7.1 candidate'
          git push origin HEAD:release/0.7.1-final
