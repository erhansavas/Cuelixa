# SPDX-License-Identifier: Apache-2.0
name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-release:
    name: macos-arm64-release
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify complete source manifest
        shell: bash
        run: ./Scripts/verify-source-manifest.sh

      - name: Prove hosted macOS 27 / Xcode 27 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          test "$(sw_vers -productVersion)" = 27.0
          xcodebuild -version
          xcrun swiftc --version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 27.0
          xcrun swiftc --version | head -n 1 | grep -Fq 'Swift version 6.4'
          host_macos_build="$(sw_vers -buildVersion)"
          host_xcode_build="$(xcodebuild -version | sed -n '2s/^Build version //p')"
          test -n "$host_macos_build"
          test -n "$host_xcode_build"
          echo "CUELIXA_HOST_MACOS_BUILD=$host_macos_build" >> "$GITHUB_ENV"
          echo "CUELIXA_HOST_XCODE_BUILD=$host_xcode_build" >> "$GITHUB_ENV"

      - name: Verify current release-note extraction
        shell: bash
        run: |
          set -euo pipefail
          settings=$(xcodebuild -project CuelixaMac.xcodeproj -scheme Cuelixa -configuration Release -showBuildSettings)
          version=$(printf '%s\n' "$settings" | awk '/ MARKETING_VERSION = / {print $3; exit}')
          build=$(printf '%s\n' "$settings" | awk '/ CURRENT_PROJECT_VERSION = / {print $3; exit}')
          notes="$RUNNER_TEMP/release-notes.md"
          ./Scripts/extract-release-notes.sh "$version" "$build" "$notes"
          test "$(head -n 1 "$notes")" = "## Cuelixa $version (build $build)"
          test "$(grep -c '^## Cuelixa ' "$notes")" = 1

      - name: Run complete validator on hosted macOS 27
        shell: bash
        run: |
          set -euo pipefail
          CUELIXA_MACOS_BUILD="$CUELIXA_HOST_MACOS_BUILD" \
          CUELIXA_XCODE_BUILD="$CUELIXA_HOST_XCODE_BUILD" \
          ./VALIDATE-MAC.sh
