# SPDX-License-Identifier: Apache-2.0
name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-release:
    name: macos-arm64-release
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CUELIXA_CI_MODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify complete source manifest
        shell: bash
        run: ./Scripts/verify-source-manifest.sh

      - name: Verify runner and stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcodebuild -version | grep -Fx 'Build version 17F113'

      - name: Validate application
        shell: bash
        run: ./VALIDATE-MAC.sh

      - name: Diagnose failed native validation
        if: failure()
        shell: bash
        run: |
          system_profiler SPAudioDataType SPDisplaysDataType
          log show --last 15m --style compact --info --predicate 'subsystem == "io.github.erhansavas.Cuelixa"'
