# SPDX-License-Identifier: Apache-2.0
name: Repair one-shot 0.7.3 preparation gate

on:
  push:
    branches: [release/0.7.3-sync]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.7.3-sync

      - name: Repair index-aware self-removal and disappear
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/prepare-073-sync.yml')
          text = path.read_text()
          old = '          rm -- .github/workflows/prepare-073-sync.yml\n'
          new = '          git rm -- .github/workflows/prepare-073-sync.yml\n'
          if text.count(old) != 1:
              raise SystemExit('expected one preparation-workflow removal command')
          path.write_text(text.replace(old, new))
          PY
          git rm -- .github/workflows/repair-prepare-073.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/prepare-073-sync.yml
          git diff --cached --check
          git commit -m 'Repair synchronized candidate preparation gate'
          git push origin HEAD:release/0.7.3-sync
