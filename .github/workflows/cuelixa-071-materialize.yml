# Temporary materializer. It removes itself before committing the candidate tree.
name: Materialize Cuelixa 0.7.1

on:
  push:
    branches: [release/0.7.1-final]

permissions:
  contents: write

concurrency:
  group: cuelixa-071-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27_beta_6.app/Contents/Developer
      CUELIXA_BUILD_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build final source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/0.7.1-final'

          git mv CuelixaMac/PlayerPanel.swift CuelixaMac/SeekSlider.swift
          sed -i '' 's/PlayerPanel\.swift/SeekSlider.swift/g' CuelixaMac.xcodeproj/project.pbxproj VALIDATE-MAC.sh

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          utilities_path = Path('CuelixaMac/Utilities.swift')
          utilities = utilities_path.read_text()
          natural_start = utilities.index('func naturalKey(')
          natural_end = utilities.index('func naturalLess(')
          utilities = utilities[:natural_start] + utilities[natural_end:]
          helper_start = utilities.index('func sha256File(')
          helper_end = utilities.index('private enum DisplayTitleCleaner')
          helpers = utilities[helper_start:helper_end].rstrip() + '\n\n'
          utilities = utilities[:helper_start] + utilities[helper_end:]
          utilities = utilities.replace('import CryptoKit\n', '').replace('import Darwin\n', '')
          utilities_path.write_text(utilities)

          local_path = Path('CuelixaMac/LocalFileAccess.swift')
          local = local_path.read_text()
          boundary = '\n/// A shared lease covers active imports; startup cleanup takes a nonblocking\n'
          if boundary not in local or 'func sha256File(' in local:
              raise SystemExit('unexpected LocalFileAccess structure')
          local = local.replace('import Darwin\n', 'import CryptoKit\nimport Darwin\n', 1)
          local = local.replace(boundary, '\n' + helpers + boundary.lstrip('\n'), 1)
          local_path.write_text(local)

          # Standalone DB smoke now compiles the production filesystem identity type.
          support_path = Path('Tests/DatabaseSmokeSupport.swift')
          support = support_path.read_text()
          signature_start = support.index('struct FileSignature:')
          natural_start = support.index('func naturalLess(')
          prefix = '''// SPDX-License-Identifier: Apache-2.0
          import Foundation

          // The standalone database smoke reuses production FileSignature from
          // LocalFileAccess.swift and supplies only the AVFoundation-free sort helper.
          '''
          support_path.write_text(prefix + support[natural_start:])

          project_path = Path('CuelixaMac.xcodeproj/project.pbxproj')
          project = project_path.read_text()
          if 'CURRENT_PROJECT_VERSION = 53;' not in project or 'MARKETING_VERSION = 0.7;' not in project:
              raise SystemExit('expected 0.7/53 project identity missing')
          project = project.replace('CURRENT_PROJECT_VERSION = 53;', 'CURRENT_PROJECT_VERSION = 54;')
          project = project.replace('MARKETING_VERSION = 0.7;', 'MARKETING_VERSION = 0.7.1;')
          project_path.write_text(project)

          release_path = Path('.github/workflows/release-dmg.yml')
          release = release_path.read_text()
          publish = '      - name: Publish matching GitHub Release\n'
          if release.count(publish) != 1:
              raise SystemExit('release publish step not unique')
          extract = (
              "      - name: Extract current release notes\n"
              "        if: github.ref_type == 'tag'\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          notes=\"$RUNNER_TEMP/release-notes.md\"\n"
              "          ./Scripts/extract-release-notes.sh \"$VERSION\" \"$BUILD\" \"$notes\"\n"
              "          echo \"RELEASE_NOTES=$notes\" >> \"$GITHUB_ENV\"\n\n"
          )
          release = release.replace(publish, extract + publish, 1)
          if release.count('--notes-file CHANGELOG.md') != 1 or release.count('            --verify-tag') != 1:
              raise SystemExit('unexpected release CLI arguments')
          release = release.replace('--notes-file CHANGELOG.md', '--notes-file "$RELEASE_NOTES"', 1)
          release = release.replace('            --verify-tag', '            --prerelease \\\n            --verify-tag', 1)
          release_path.write_text(release)

          validator_path = Path('VALIDATE-MAC.sh')
          validator = validator_path.read_text()
          marker = "print '=== Environment ==='\n"
          if validator.count(marker) != 1:
              raise SystemExit('validator environment marker not unique')
          release_test = (
              'release_notes_check=$(mktemp "${TMPDIR:-/tmp}/cuelixa-release-notes.XXXXXX")\n'
              './Scripts/extract-release-notes.sh "$expected_version" "$expected_build" "$release_notes_check"\n'
              '[[ "$(head -n 1 "$release_notes_check")" == "## Cuelixa $expected_version (build $expected_build)" ]] || fail \'release notes heading mismatch\'\n'
              '[[ "$(grep -c \'^## Cuelixa \' "$release_notes_check")" == 1 ]] || fail \'release notes crossed a release boundary\'\n'
              'rm -f "$release_notes_check"\n'
              "pass 'RELEASE_NOTES_EXTRACTION'\n\n"
          )
          validator_path.write_text(validator.replace(marker, release_test + marker, 1))

          # Current GitHub xcode-27 images now run macOS 27. Keep PR CI as a
          # complete hosted regression gate; local exact-SHA qualification remains independent.
          ci_path = Path('.github/workflows/macos.yml')
          ci = ci_path.read_text()
          ci = ci.replace("      CUELIXA_BUILD_ONLY: '1'\n", '')
          ci = ci.replace(
              '          sw_vers\n          xcodebuild -version\n',
              '          sw_vers\n          test "$(sw_vers -productVersion | cut -d. -f1)" = 27\n          xcodebuild -version\n',
              1,
          )
          ci = ci.replace(
              '      - name: Compile tests, build, and analyze for macOS 27\n',
              '      - name: Run complete validator on macOS 27\n',
              1,
          )
          ci_path.write_text(ci)

          replacements = {
              Path('README.md'): [
                  ('Hosted GitHub Xcode 27 runners currently provide build/Analyze evidence on a macOS 26 host; they do **not** replace the required macOS 27 runtime/UI qualification.',
                   'The permanent GitHub `xcode-27` CI runs the complete validator on its macOS 27 host, but it does **not** replace the independent exact-SHA qualification on the designated Mac before merge.'),
                  ('On an unsupported hosted macOS 26 runner, `CUELIXA_BUILD_ONLY=1` deliberately compiles runtime targets without executing macOS 27 tests.',
                   'The required PR CI runs the same complete validator on GitHub’s macOS 27 `xcode-27` host. The release-packaging job may still use build-only validation as an additional package-side compile/Analyze check after the independent release gates have passed.'),
              ],
              Path('docs/BUILD.md'): [
                  ('The permanent macOS CI uses GitHub\'s Apple silicon `xcode-27` image and selects Xcode 27 beta 6 explicitly. GitHub currently hosts this image on macOS 26, so CI sets `CUELIXA_BUILD_ONLY=1`.\n\nBuild-only mode still verifies source integrity, formatting, project settings, application/test compilation, Debug and Release builds, Analyze, smoke-executable compilation, architecture, deployment target, and bundle metadata. Runtime-only executables and UI tests are reported as **compiled only** rather than executed.\n\nHosted build-only evidence never substitutes for the full macOS 27 qualification required by [RELEASE.md](RELEASE.md).',
                   'The permanent macOS CI uses GitHub\'s Apple silicon `xcode-27` image, requires a macOS 27 host, selects Xcode 27 beta 6 explicitly, and runs the complete repository validator. This provides a second full regression signal on GitHub infrastructure.\n\nRelease qualification still requires an independent complete run on the designated Apple silicon Mac for the exact candidate SHA before merge; hosted success is not substituted for that gate. The release-packaging workflow may use build-only mode as an additional package-side compile/Analyze check after qualification.'),
              ],
              Path('docs/QUALIFICATION.md'): [
                  ('GitHub\'s `xcode-27` Apple silicon image supplies the Xcode 27 beta 6 toolchain but currently runs a macOS 26 host. The permanent `macos-arm64-release` job therefore runs the validator with `CUELIXA_BUILD_ONLY=1`.\n\nThat mode compiles the macOS 27 application/test/smoke targets, builds Debug and Release, runs Analyze, and verifies source/bundle metadata, but it deliberately **does not execute** binaries that require the macOS 27 runtime. Hosted success is build/compile/Analyze evidence only.',
                   'GitHub\'s current Apple silicon `xcode-27` image runs macOS 27 and supplies the Xcode 27 beta 6 toolchain. The permanent `macos-arm64-release` job requires that macOS 27 host and runs the complete validator, including the configured runtime and native UI coverage.\n\nThis hosted run is an additional regression gate. Release qualification still requires an independent complete run on the designated Apple silicon Mac for the exact candidate SHA before merge.'),
              ],
              Path('CHANGELOG.md'): [
                  ('Hosted Xcode 27 CI is build/compile/Analyze evidence only because its current host is macOS 26.',
                   'GitHub Xcode 27 CI also runs the complete validator on its macOS 27 host; independent exact-SHA qualification on the designated Mac remains required before merge.'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'documentation freshness anchor missing: {path}: {old[:50]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          audit = Path('AUDIT-REPORT.md')
          if not audit.exists():
              raise SystemExit('historical audit missing')
          target = Path('docs/audits/2026-09-engineering-audit.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          for md in Path('.').rglob('*.md'):
              if md == audit:
                  continue
              source = md.read_text()
              rel = os.path.relpath(target, md.parent).replace(os.sep, '/')
              updated = re.sub(r'(?<=\()(?:(?:\.\./)*)AUDIT-REPORT\.md(?=\))', rel, source)
              if updated != source:
                  md.write_text(updated)
          PY

          git mv AUDIT-REPORT.md docs/audits/2026-09-engineering-audit.md
          cat > docs/audits/README.md <<'EOF'
          # Historical engineering audits

          Files here preserve point-in-time engineering evidence. They are not current architecture, qualification status, or release source of truth.

          - `2026-09-engineering-audit.md` records the earlier 0.6.66/0.7 engineering audit and its then-current environments/results.

          Current implementation ownership is in [`../ARCHITECTURE.md`](../ARCHITECTURE.md); current qualification and release gates are in [`../QUALIFICATION.md`](../QUALIFICATION.md) and [`../RELEASE.md`](../RELEASE.md).
          EOF

          chmod +x Scripts/extract-release-notes.sh
          xcrun swift-format format -i CuelixaMac/LocalFileAccess.swift CuelixaMac/Utilities.swift CuelixaMac/SeekSlider.swift Tests/DatabaseSmokeSupport.swift

          test ! -e CuelixaMac/PlayerPanel.swift
          test -f CuelixaMac/SeekSlider.swift
          if grep -R -nF 'PlayerPanel.swift' CuelixaMac CuelixaMac.xcodeproj VALIDATE-MAC.sh docs README.md CHANGELOG.md; then exit 1; fi
          grep -Fq 'MARKETING_VERSION = 0.7.1;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq 'CURRENT_PROJECT_VERSION = 54;' CuelixaMac.xcodeproj/project.pbxproj
          grep -Fq -- '--notes-file "$RELEASE_NOTES"' .github/workflows/release-dmg.yml
          grep -Fq -- '--prerelease' .github/workflows/release-dmg.yml
          if grep -R -nF 'func naturalKey(' CuelixaMac; then exit 1; fi
          grep -Fq 'func sha256File(' CuelixaMac/LocalFileAccess.swift
          if grep -Fq 'struct FileSignature:' Tests/DatabaseSmokeSupport.swift; then exit 1; fi
          if grep -Fq 'CUELIXA_BUILD_ONLY' .github/workflows/macos.yml; then exit 1; fi
          grep -Fq 'test "$(sw_vers -productVersion | cut -d. -f1)" = 27' .github/workflows/macos.yml

      - name: Freeze source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm --quiet .github/workflows/cuelixa-071-materialize.yml
          git add -A
          manifest=SOURCE-SHA256SUMS.txt
          temp=$(mktemp)
          while IFS= read -r path; do
            test "$path" = "$manifest" && continue
            shasum -a 256 "$path"
          done < <(git ls-files | LC_ALL=C sort) > "$temp"
          mv "$temp" "$manifest"
          git add "$manifest"
          ./Scripts/verify-source-manifest.sh
          notes=$(mktemp)
          ./Scripts/extract-release-notes.sh 0.7.1 54 "$notes"
          test "$(head -n 1 "$notes")" = '## Cuelixa 0.7.1 (build 54)'
          test "$(grep -c '^## Cuelixa ' "$notes")" = 1
          rm -f "$notes"
          test ! -e .github/workflows/cuelixa-071-materialize.yml

      - name: Hosted build-only precommit validation
        shell: bash
        run: ./VALIDATE-MAC.sh

      - name: Commit materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/cuelixa-071-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Finalize Cuelixa 0.7.1 candidate'
          git push origin HEAD:release/0.7.1-final
